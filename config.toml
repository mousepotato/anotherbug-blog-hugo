baseURL = "https://anotherbug.com"
title = "鼠标土豆"
languageCode = "zh-cn"
DefaultContentLanguage = "zh-cn"
hasCJKLanguage = true
theme = "tapa"

paginate = 15
enableEmoji = true
enableRobotsTXT = true
pygmentsUseClasses = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[frontmatter]
date = [":filename", ":default"]

[permalinks]
posts = "/:year/:month/:day/:slug"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 2

  [[menu.main]]
    name = "Thoughts"
    url = "/thoughts/"
    weight = 3

  [[menu.main]]
    name = "Uses"
    url = "/tools/"
    weight = 4

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

[params]
  env = "production"
  author = "mousepotato"
  description = "鼠标土豆，硅谷 11 年软件工程师，独立开发者。一个人用 AI 构建产品：Octoflow、Vidflow、Octopus 等。写独立开发、AI 工具、一人公司的真实经验。"
  keywords = ["独立开发者", "一人公司", "AI 工具", "独立产品", "硅谷", "Indie Hacker", "Programming"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowAllPagesInArchive = false
  ShowPageNums = true
  ShowToc = false
  disableSpecial1stPost = true
  mainSections = ["posts"]
  images = ["assets/images/profile.jpg"]

  # 供 {{< email >}} shortcode 使用；不会以明文形式出现在构建产物里。
  contactEmail = "paradise.lsj@gmail.com"

  [params.adsense]
    client = "ca-pub-2012267054436559"
    # AdSense 广告单元 anotherbug-article-end 的 data-ad-slot。
    # 留空时不加载任何 AdSense 脚本、不渲染任何广告位。
    articleEndSlot = "4955473422"
    # 低于该字数的文章不投广告（中文按字符计，hasCJKLanguage 已开启）。
    minWords = 200

  [params.footer]
    text = "[隐私政策](/privacy-policy/)"

  [params.label]
    text = "鼠标土豆"

  [params.homeInfoParams]
    Title = ""
    Content = "「人生最好的境界是丰富的安静」 — 周国平"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/mousepotato"

  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url = "/index.xml"

  [params.schema]
    publisherType = "Person"

  [params.authorDetails]
    name = "鼠标土豆 (mousepotato)"
    jobTitle = "独立开发者 / Indie Hacker"
    description = "硅谷 11 年软件工程师，独立开发者，已发布 6 个 App。一个人用 AI 构建产品，记录一人公司的真实过程。"
    sameAs = [
      "https://github.com/mousepotato",
      "https://x.com/iluciddreaming",
      "https://www.youtube.com/@toudouge_ai",
      "https://anotherbug.com/about"
    ]

  [params.assets]
    favicon = "/assets/images/favicon.svg"
    favicon16x16 = "/assets/images/favicon.svg"
    favicon32x32 = "/assets/images/favicon.svg"
    apple_touch_icon = "/assets/images/favicon.ico"

  [params.analytics]
    academicGoogleAnalyticsID = "G-WENJWHP3ZL"

[services]
  [services.googleAnalytics]
    ID = "G-YWXEHB24LZ"
